<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pembroke Pines 4-Bedroom Market Report · The Miami Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--navy:#0A1628;--navy2:#0F2038;--ink:#07101E;--gold:#C9A84C;--bone:#F8F6F1;--mute:rgba(248,246,241,.62);--line:rgba(248,246,241,.12);--neg:#D96C5F}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--navy),var(--navy2));color:var(--bone);font-family:Inter,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:28px 20px 40px}
.bug{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.22em;color:var(--gold);font-weight:600;border-bottom:1px solid rgba(201,168,76,.5);padding-bottom:10px}
.lang button{background:none;border:1px solid rgba(201,168,76,.5);color:var(--bone);font:600 12px Inter;letter-spacing:.1em;padding:6px 10px;cursor:pointer}
.lang button.on{background:var(--gold);color:var(--navy)}
h1{font:600 clamp(48px,9vw,84px)/1 'Cormorant Garamond',serif;margin:26px 0 6px}
.sub{color:var(--mute);font-size:17px;margin:0}
.hero{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end;margin:22px 0 8px}
.big{font:600 clamp(52px,10vw,92px)/1 'Cormorant Garamond',serif;color:var(--gold);font-variant-numeric:lining-nums}
.bigl{color:var(--bone);font-size:15px;max-width:340px;padding-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
.kpi{background:rgba(7,16,30,.75);border:1px solid rgba(201,168,76,.4);border-left:3px solid var(--gold);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font:600 30px 'Cormorant Garamond',serif;color:var(--gold);font-variant-numeric:lining-nums tabular-nums}
.kpi span{font-size:12.5px;color:var(--mute)}
.card{background:rgba(7,16,30,.6);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:7px 13px;font:500 13px Inter;cursor:pointer}
.tabs button.on{border-color:var(--gold);color:var(--navy);background:var(--gold)}
h2{font:600 30px 'Cormorant Garamond',serif;margin:2px 0 4px}
.k{font-size:11.5px;letter-spacing:.2em;color:var(--gold);font-weight:600;text-transform:uppercase}
svg text{font-variant-numeric:lining-nums tabular-nums}
.tw{overflow-x:auto}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mute);margin:8px 0}.leg i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
svg{width:100%;height:auto;display:block;touch-action:manipulation}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px;font-size:13px;color:var(--mute)}
.readout div b{display:block;color:var(--bone);font:600 22px 'Cormorant Garamond',serif;font-variant-numeric:lining-nums tabular-nums}
.yrs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.yrs button{flex:1;min-width:58px;background:none;border:1px solid var(--line);color:var(--mute);padding:7px 4px;border-radius:8px;font:500 13px Inter;cursor:pointer}
.yrs button.on{border-color:var(--gold);color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:11.5px;letter-spacing:.08em;color:var(--mute);font-weight:600;text-transform:uppercase}
td.n{font-variant-numeric:tabular-nums}
tr.hl td{color:var(--gold)}
.up{color:var(--gold)}.dn{color:var(--neg)}.mu{color:var(--mute);font-size:12px}
@media(max-width:560px){table{font-size:12.5px}th{font-size:10px}}
.note{font-size:13.5px;color:var(--mute);line-height:1.55}
.note b{color:var(--bone)}
.src{font-size:11.5px;color:var(--mute);margin-top:10px;line-height:1.5}
.bars3d{width:100%;height:auto;display:block;margin:6px 0 4px;border-radius:10px}
.stats3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}
.read{font:500 clamp(24px,4.5vw,32px)/1.3 'Cormorant Garamond',serif;text-align:center;padding:16px 6px}
.read em{color:var(--gold);font-style:normal}
.net{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.cta{background:var(--gold);color:var(--navy);border-radius:16px;padding:22px;display:grid;grid-template-columns:96px 1fr;gap:18px;align-items:center}
.cta img.h{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--navy)}
.cta h3{font:700 28px 'Cormorant Garamond',serif;margin:0 0 4px}
.cta p{margin:0 0 10px;font-size:14px}
.cta input{width:100%;padding:11px;border-radius:8px;border:1px solid rgba(10,22,40,.4);font:500 16px Inter;margin-bottom:8px}
.cta a.btn{display:inline-block;background:var(--navy);color:var(--bone);text-decoration:none;padding:11px 16px;border-radius:8px;font:600 14px Inter}
.cta small{display:block;margin-top:8px;font-size:12.5px}
footer{text-align:center;font-size:12px;color:var(--mute);margin-top:22px;line-height:1.7}
footer img{background:var(--bone);border-radius:8px;padding:6px 10px;height:46px;margin-top:8px}
@media(max-width:560px){.cta{grid-template-columns:1fr;text-align:center}.cta img.h{margin:0 auto}}
</style></head><body><div class="wrap">

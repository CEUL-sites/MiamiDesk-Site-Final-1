name: Daily Journal Publisher

on:
  schedule:
    # 8:35 AM America/New_York during daylight saving time.
    - cron: '35 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-journal-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish one SEO journal post
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily journal post
        run: node scripts/daily-journal-publisher.mjs

      # If a previous run lost its browser, that post is still sitting there
      # without a card. This re-renders anything missing and links the image:
      # field, so a one-day outage self-heals on the next run instead of
      # leaving a post permanently without an og:image.
      - name: Backfill any missing share cards
        run: node scripts/render-journal-og.mjs

      - name: Verify journal content
        run: npm run verify:journal

      - name: Verify TypeScript
        run: npm run lint

      - name: Verify production build
        run: npm run build

      - name: Commit published journal post
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new journal post generated today."
            exit 0
          fi
          git config user.name "homesprofessional-journal-bot"
          git config user.email "actions@github.com"
          git add src/content/journal package.json public/sitemap.xml public/images/journal/og
          git commit -m "Publish daily SEO journal post"

          # main can move while this job runs. The checkout happens at the start
          # and the push several minutes later, after generate + verify + lint +
          # build, so any merge landing in that window makes this a
          # non-fast-forward. It used to abort the step and lose the day's post
          # outright: on 2026-08-05 a PR merged four seconds after this workflow
          # started, and the generated post was never published.
          #
          # Rebase onto whatever landed and retry. A conflict is left to a human
          # rather than resolved blindly — the post is regenerable, a bad
          # auto-resolution of sitemap.xml or reactSnap.include is not.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed the daily post on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt} — rebasing onto origin/main."
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true
              echo "::error title=Daily journal post not pushed::Rebase onto origin/main hit a conflict. The post was generated and committed locally but never pushed — re-run this workflow to regenerate it."
              exit 1
            fi
          done

          echo "::error title=Daily journal post not pushed::Still non-fast-forward after 3 rebase attempts; main is moving faster than this job can land. Re-run the workflow."
          exit 1
